name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          # The font rebuild check reads the upstream sources from history (e725422).
          fetch-depth: 0
      # The fleet's Quarto pin (my-academic-website scripts/ci/quarto-version.txt).
      - name: Install Quarto CLI
        timeout-minutes: 10
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2
        with:
          version: 1.10.19
      # shellcheck, build-fonts.py syntax, version/CHANGELOG, fonts.css vs fonts/,
      # a byte-identical rebuild of fonts/, and a render of tests/fixture/ with the vendored theme and every include.
      # The runner image's shellcheck (0.9.0 on ubuntu-latest) flags patterns
      # 0.11.0 accepts; pin the version the checks were written against.
      - name: Install shellcheck 0.11.0
        run: |
          pipx install shellcheck-py==0.11.0.1
          shellcheck --version | grep -qx 'version: 0.11.0'

      # The fontTools that reproduces the committed fonts/ byte for byte.
      - name: Install the font toolchain
        run: |
          python3 -m venv "$RUNNER_TEMP/fonts-venv"
          "$RUNNER_TEMP/fonts-venv/bin/pip" install --quiet -r scripts/requirements-fonts.txt
          echo "CARO_FONTS_PYTHON=$RUNNER_TEMP/fonts-venv/bin/python" >> "$GITHUB_ENV"

      # tests/external-links-check.js runs the fixture's links in Chromium; the
      # Playwright pin is tests/package.json (lockfile beside it). tests/reflow
      # installs the reflow gate's own copy (the same pin) and uses this Chromium.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
      - name: Install Playwright and Chromium
        timeout-minutes: 10
        working-directory: tests
        run: npm ci --no-audit --no-fund --ignore-scripts && npx --no-install playwright install --with-deps chromium

      - name: Run checks
        run: bash scripts/ci-check.sh
