<!-- Typography is self-hosted: vendored fonts/ dir + fonts/fonts.css at each
     site root (see caro-quarto/fonts/). fonts.css is wired via
     format.html.css in each site's _quarto.yml so Quarto rewrites the link
     per page depth; @font-face url()s resolve relative to the css file.
     This include is kept (empty) so existing include-in-header lists keep
     working across the fleet. Previous Adobe Fonts kit (gtn3noi) retired —
     OFL upstream builds preserve the OpenType features (smcp/onum/tnum)
     that both the Adobe kit's ToS-locked CDN and the Google Fonts CSS API
     could not guarantee. -->
