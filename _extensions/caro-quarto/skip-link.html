<script>
// Quarto (1.11 and later) renders the skip link, #quarto-skip-link, as the first
// element of <body>, in the page's language. quarto-nav.js rewrites every link to
// an absolute URL without index.html, so on /dir/index.html the link pointed at
// /dir/#quarto-document-content and reloaded the page instead of moving focus.
// Move focus to the target in place instead of following the href.
document.addEventListener("click", function (e) {
  var link = e.target.closest ? e.target.closest("a#quarto-skip-link") : null;
  var main = link ? document.getElementById("quarto-document-content") : null;
  if (!main) return;
  e.preventDefault();
  if (!main.hasAttribute("tabindex")) main.setAttribute("tabindex", "-1");
  main.focus();
});
</script>
