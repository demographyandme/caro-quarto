<script>
(function () {
  "use strict";

  var INTERNAL = /^(www\.)?demographyandme\.com$/i;
  var CUE = "(opens in a new tab)";
  var HAS_CUE = /new (tab|window)/i;

  function shouldSkip(a) {
    if (a.hasAttribute("data-skip-external")) return true;
    return !!a.closest(
      ".navbar, .quarto-navbar, .nav-footer, footer.page-footer, .dropdown-menu, #quarto-margin-sidebar"
    );
  }

  /* Root URL of the current Quarto site. quarto:offset is only emitted when
     search is on (every fleet site sets search: false), so fall back to the
     site_libs/ script every website page loads from the site root (404.html
     gets it as an absolute site path). null when neither is found. */
  function siteRoot() {
    try {
      var meta = document.querySelector('meta[name="quarto:offset"]');
      if (meta) return new URL(meta.getAttribute("content"), location.href);
      var s = document.querySelector('script[src*="site_libs/quarto-nav/"]');
      if (s) return new URL(s.src.slice(0, s.src.indexOf("site_libs/")));
    } catch (e) {}
    return null;
  }

  /* Decided on the resolved URL (a.href), not the attribute text: quarto-nav.js
     rewrites every href to an absolute URL before this runs, so "#x" arrives as
     "https://demographyandme.github.io/<slug>/#x". Inside = same origin and a path
     under the site root. A link to another companion (same origin, different
     /<slug>/ path) is not inside and keeps opening in a new tab, as before. */
  function insideSite(u, root) {
    if (u.origin !== location.origin) return false;
    if (u.pathname === location.pathname) return true;
    if (!root) return false;
    return u.pathname.indexOf(root.pathname) === 0 || u.pathname + "/" === root.pathname;
  }

  /* New-tab cue for screen readers only (WCAG G201), added once. A text link
     gets it in aria-label (its visible text, then the cue): a hidden span
     appended inside the link re-wraps text-wrap: pretty paragraphs. A link with
     an image keeps its alt text as name and gets a .visually-hidden span. */
  function addCue(a) {
    if (a.querySelector(".caro-newtab-cue")) return;
    var label = a.getAttribute("aria-label");
    if (label !== null) {
      if (!HAS_CUE.test(label)) a.setAttribute("aria-label", label + " " + CUE);
      return;
    }
    var text = a.textContent.replace(/\s+/g, " ").trim();
    if (HAS_CUE.test(text) || HAS_CUE.test(a.getAttribute("title") || "")) return;
    if (text && !a.querySelector("img, svg, picture, video, canvas")) {
      a.setAttribute("aria-label", text + " " + CUE);
      return;
    }
    var cue = document.createElement("span");
    cue.className = "visually-hidden caro-newtab-cue";
    cue.textContent = " " + CUE;
    a.appendChild(cue);
  }

  function markNewTab(a) {
    a.setAttribute("target", "_blank");
    a.setAttribute("rel", "noopener noreferrer");
    addCue(a);
  }

  function applyExternalLinks() {
    var root = siteRoot();
    document.querySelectorAll("a[href]").forEach(function (a) {
      if (shouldSkip(a) || a.classList.contains("skip-link")) return;
      var href = a.getAttribute("href");
      if (!href || href.charAt(0) === "#") return;

      if (a.classList.contains("project-card-link") || a.classList.contains("project-card-figure")) {
        markNewTab(a);
        return;
      }

      var u;
      try {
        u = new URL(a.href, document.baseURI);
      } catch (e) {
        return;
      }
      if (!u.hostname || INTERNAL.test(u.hostname) || insideSite(u, root)) return;
      markNewTab(a);
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", applyExternalLinks);
  } else {
    applyExternalLinks();
  }
})();
</script>
